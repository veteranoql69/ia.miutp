<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowViolet" cx="20%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="80%" cy="76%" r="48%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.75" fill="#1e293b"/>
    </pattern>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Base dark background -->
  <rect width="1920" height="1080" fill="#020617"/>

  <!-- Dot grid overlay -->
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.9"/>

  <!-- Atmospheric gradient glows -->
  <rect width="1920" height="1080" fill="url(#glowViolet)"/>
  <rect width="1920" height="1080" fill="url(#glowIndigo)"/>
  <rect width="1920" height="1080" fill="url(#glowCenter)"/>

  <!-- ── Network edges ── -->
  <g stroke="#1e3a5f" stroke-width="0.9" fill="none" opacity="0.65">
    <!-- Hub A (310, 230) fan -->
    <line x1="310" y1="230" x2="155" y2="140"/>
    <line x1="310" y1="230" x2="430" y2="155"/>
    <line x1="310" y1="230" x2="210" y2="385"/>
    <line x1="310" y1="230" x2="490" y2="345"/>
    <line x1="310" y1="230" x2="560" y2="185"/>
    <line x1="310" y1="230" x2="140" y2="505"/>
    <!-- Hub B (960, 545) fan -->
    <line x1="960" y1="545" x2="710" y2="490"/>
    <line x1="960" y1="545" x2="830" y2="655"/>
    <line x1="960" y1="545" x2="1110" y2="490"/>
    <line x1="960" y1="545" x2="1260" y2="630"/>
    <line x1="960" y1="545" x2="860" y2="290"/>
    <line x1="960" y1="545" x2="1090" y2="710"/>
    <line x1="960" y1="545" x2="1355" y2="460"/>
    <!-- Hub C (1660, 325) fan -->
    <line x1="1660" y1="325" x2="1460" y2="135"/>
    <line x1="1660" y1="325" x2="1790" y2="210"/>
    <line x1="1660" y1="325" x2="1690" y2="500"/>
    <line x1="1660" y1="325" x2="1490" y2="430"/>
    <line x1="1660" y1="325" x2="1260" y2="210"/>
    <!-- Inter-hub spines -->
    <line x1="310" y1="230" x2="960" y2="545"/>
    <line x1="960" y1="545" x2="1660" y2="325"/>
    <!-- Top chain -->
    <line x1="560" y1="185" x2="710" y2="185"/>
    <line x1="710" y1="185" x2="860" y2="290"/>
    <line x1="860" y1="290" x2="1090" y2="155"/>
    <line x1="1090" y1="155" x2="1260" y2="210"/>
    <line x1="1260" y1="210" x2="1460" y2="135"/>
    <!-- Left descending chain -->
    <line x1="490" y1="345" x2="710" y2="490"/>
    <line x1="710" y1="490" x2="830" y2="655"/>
    <line x1="830" y1="655" x2="660" y2="830"/>
    <line x1="660" y1="830" x2="455" y2="830"/>
    <line x1="455" y1="830" x2="260" y2="710"/>
    <line x1="260" y1="710" x2="210" y2="385"/>
    <line x1="140" y1="505" x2="260" y2="710"/>
    <line x1="105" y1="880" x2="260" y2="710"/>
    <line x1="105" y1="880" x2="455" y2="830"/>
    <!-- Right descending chain -->
    <line x1="1110" y1="490" x2="1260" y2="630"/>
    <line x1="1260" y1="630" x2="1460" y2="560"/>
    <line x1="1460" y1="560" x2="1690" y2="500"/>
    <line x1="1690" y1="500" x2="1830" y2="440"/>
    <line x1="1830" y1="440" x2="1790" y2="210"/>
    <line x1="1830" y1="440" x2="1830" y2="660"/>
    <line x1="1830" y1="660" x2="1610" y2="690"/>
    <line x1="1610" y1="690" x2="1690" y2="500"/>
    <line x1="1610" y1="690" x2="1730" y2="795"/>
    <line x1="1730" y1="795" x2="1830" y2="660"/>
    <!-- Bottom chain -->
    <line x1="1090" y1="710" x2="1260" y2="630"/>
    <line x1="1090" y1="710" x2="1010" y2="910"/>
    <line x1="1010" y1="910" x2="810" y2="830"/>
    <line x1="810" y1="830" x2="660" y2="830"/>
    <line x1="1010" y1="910" x2="1210" y2="880"/>
    <line x1="1210" y1="880" x2="1360" y2="795"/>
    <line x1="1360" y1="795" x2="1460" y2="560"/>
    <line x1="1360" y1="795" x2="1610" y2="690"/>
  </g>

  <!-- Secondary faint edges -->
  <g stroke="#2d3748" stroke-width="0.5" fill="none" opacity="0.35">
    <line x1="430" y1="155" x2="560" y2="185"/>
    <line x1="155" y1="140" x2="430" y2="155"/>
    <line x1="1790" y1="210" x2="1460" y2="135"/>
    <line x1="490" y1="345" x2="560" y2="185"/>
    <line x1="710" y1="490" x2="710" y2="185"/>
    <line x1="1110" y1="490" x2="1090" y2="155"/>
    <line x1="1355" y1="460" x2="1490" y2="430"/>
    <line x1="1355" y1="460" x2="1260" y2="630"/>
    <line x1="830" y1="655" x2="1090" y2="710"/>
  </g>

  <!-- ── Hub diffuse glows ── -->
  <circle cx="310" cy="230" r="90" fill="url(#hubGlowA)" filter="url(#blurMd)"/>
  <circle cx="960" cy="545" r="110" fill="url(#hubGlowB)" filter="url(#blurMd)"/>
  <circle cx="1660" cy="325" r="90" fill="url(#hubGlowA)" filter="url(#blurMd)"/>

  <!-- ── Regular nodes ── -->
  <g fill="#253a52" stroke="#334155" stroke-width="0.8">
    <circle cx="155"  cy="140"  r="3"/>
    <circle cx="430"  cy="155"  r="3.5"/>
    <circle cx="210"  cy="385"  r="3"/>
    <circle cx="490"  cy="345"  r="4"/>
    <circle cx="560"  cy="185"  r="3"/>
    <circle cx="140"  cy="505"  r="2.5"/>
    <circle cx="710"  cy="185"  r="3.5"/>
    <circle cx="860"  cy="290"  r="4"/>
    <circle cx="1090" cy="155"  r="3"/>
    <circle cx="1260" cy="210"  r="3.5"/>
    <circle cx="1460" cy="135"  r="3"/>
    <circle cx="1790" cy="210"  r="3.5"/>
    <circle cx="710"  cy="490"  r="4.5" fill="#2d4a68"/>
    <circle cx="830"  cy="655"  r="4"   fill="#2d4a68"/>
    <circle cx="1110" cy="490"  r="4.5" fill="#2d4a68"/>
    <circle cx="1260" cy="630"  r="4"   fill="#2d4a68"/>
    <circle cx="1355" cy="460"  r="3.5"/>
    <circle cx="1490" cy="430"  r="3.5"/>
    <circle cx="1690" cy="500"  r="4"   fill="#2d4a68"/>
    <circle cx="1830" cy="440"  r="3"/>
    <circle cx="260"  cy="710"  r="3.5"/>
    <circle cx="455"  cy="830"  r="3"/>
    <circle cx="660"  cy="830"  r="3.5"/>
    <circle cx="810"  cy="830"  r="3"/>
    <circle cx="1010" cy="910"  r="4"   fill="#2d4a68"/>
    <circle cx="1090" cy="710"  r="3.5"/>
    <circle cx="1210" cy="880"  r="3.5"/>
    <circle cx="1360" cy="795"  r="3"/>
    <circle cx="1610" cy="690"  r="3.5"/>
    <circle cx="1730" cy="795"  r="3"/>
    <circle cx="1830" cy="660"  r="3"/>
    <circle cx="105"  cy="880"  r="2.5"/>
  </g>

  <!-- ── Hub nodes (prominent rings) ── -->
  <!-- Hub A -->
  <circle cx="310" cy="230" r="7"  fill="#5b21b6" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="310" cy="230" r="12" fill="none"    stroke="#8b5cf6" stroke-width="0.7" opacity="0.45"/>
  <circle cx="310" cy="230" r="18" fill="none"    stroke="#8b5cf6" stroke-width="0.4" opacity="0.2"/>
  <!-- Hub B -->
  <circle cx="960" cy="545" r="9"  fill="#3730a3" stroke="#6366f1" stroke-width="1.8"/>
  <circle cx="960" cy="545" r="15" fill="none"    stroke="#6366f1" stroke-width="0.9" opacity="0.45"/>
  <circle cx="960" cy="545" r="22" fill="none"    stroke="#6366f1" stroke-width="0.5" opacity="0.22"/>
  <circle cx="960" cy="545" r="30" fill="none"    stroke="#6366f1" stroke-width="0.3" opacity="0.1"/>
  <!-- Hub C -->
  <circle cx="1660" cy="325" r="7"  fill="#5b21b6" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="1660" cy="325" r="12" fill="none"    stroke="#8b5cf6" stroke-width="0.7" opacity="0.45"/>
  <circle cx="1660" cy="325" r="18" fill="none"    stroke="#8b5cf6" stroke-width="0.4" opacity="0.2"/>

  <!-- ── Decorative data elements ── -->
  <!-- Bar chart watermark — bottom left -->
  <g opacity="0.07" transform="translate(55 890)">
    <rect x="0"  y="65" width="13" height="40" fill="#8b5cf6" rx="2"/>
    <rect x="19" y="42" width="13" height="63" fill="#6366f1" rx="2"/>
    <rect x="38" y="52" width="13" height="53" fill="#8b5cf6" rx="2"/>
    <rect x="57" y="18" width="13" height="87" fill="#6366f1" rx="2"/>
    <rect x="76" y="34" width="13" height="71" fill="#8b5cf6" rx="2"/>
    <rect x="95" y="55" width="13" height="50" fill="#6366f1" rx="2"/>
  </g>

  <!-- Bar chart watermark — top right -->
  <g opacity="0.07" transform="translate(1790 55)">
    <rect x="0"  y="55" width="13" height="50" fill="#6366f1" rx="2"/>
    <rect x="19" y="28" width="13" height="77" fill="#8b5cf6" rx="2"/>
    <rect x="38" y="40" width="13" height="65" fill="#6366f1" rx="2"/>
    <rect x="57" y="15" width="13" height="90" fill="#8b5cf6" rx="2"/>
    <rect x="76" y="32" width="13" height="73" fill="#6366f1" rx="2"/>
  </g>

  <!-- Concentric arcs watermark — bottom right -->
  <g opacity="0.055" transform="translate(1710 820)">
    <path d="M0 100 A100 100 0 0 1 100 0"   stroke="#6366f1" stroke-width="2"   fill="none"/>
    <path d="M0 135 A135 135 0 0 1 135 0"   stroke="#8b5cf6" stroke-width="1.5" fill="none"/>
    <path d="M0 170 A170 170 0 0 1 170 0"   stroke="#6366f1" stroke-width="1"   fill="none"/>
    <path d="M0 205 A205 205 0 0 1 205 0"   stroke="#8b5cf6" stroke-width="0.7" fill="none"/>
  </g>

  <!-- Concentric arcs watermark — top left -->
  <g opacity="0.045" transform="translate(0 0) rotate(180 110 110)">
    <path d="M0 100 A100 100 0 0 1 100 0"   stroke="#8b5cf6" stroke-width="1.5" fill="none"/>
    <path d="M0 140 A140 140 0 0 1 140 0"   stroke="#6366f1" stroke-width="1"   fill="none"/>
    <path d="M0 180 A180 180 0 0 1 180 0"   stroke="#8b5cf6" stroke-width="0.7" fill="none"/>
  </g>
</svg>
